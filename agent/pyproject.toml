[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalafarin-host-agent"
version = "0.1.0"
description = "Read-only host agent for DigitalAfarin Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "psutil>=6,<8",
  "pydantic-settings>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["digitalafarin_agent*"]
