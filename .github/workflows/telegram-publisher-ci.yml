name: Telegram Publisher CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "telegram-mcp/**"
      - "infra/**"
      - ".github/workflows/telegram-publisher-ci.yml"
  push:
    branches: [feat/telegram-publisher]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DJANGO_SECRET_KEY: ci-secret
      DJANGO_DEBUG: "0"
      TELEGRAM_CREDENTIAL_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py test control.tests -v 2
      - run: python manage.py check

  telegram-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-mcp/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e './telegram-mcp[dev]'
      - run: python -m pytest telegram-mcp/tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      PLATFORM_API_TOKEN: ci-platform-token
      TELEGRAM_PLATFORM_API_TOKEN: ci-telegram-token
      PLATFORM_API_URL: http://127.0.0.1:9750
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: npm run build
