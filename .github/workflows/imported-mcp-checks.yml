name: Imported MCP workspaces

on:
  pull_request:
    paths:
      - 'services/agency/**'
      - 'services/wordpress/**'
      - 'scripts/import-mcp-workspaces.sh'
      - 'scripts/check-mcp-imports.mjs'
      - '.github/workflows/imported-mcp-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-workspaces:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [agency, wordpress]
    steps:
      - uses: actions/checkout@v4
      - name: Check workspace imported
        id: present
        shell: bash
        run: |
          if [ -f "services/${{ matrix.workspace }}/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Workspace not imported yet; migration PR cannot be released."
          fi
      - uses: actions/setup-node@v4
        if: steps.present.outputs.present == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'services/${{ matrix.workspace }}/package-lock.json'
      - name: Verify dependency lockfile
        shell: bash
        run: |
          test -f "services/${{ matrix.workspace }}/package.json"
          test -f "services/${{ matrix.workspace }}/package-lock.json"
      - name: Check dependency manifest parity
        run: node scripts/check-mcp-imports.mjs
        working-directory: .
      - name: npm ci
        working-directory: services/${{ matrix.workspace }}
        run: npm ci
      - name: TypeScript check
        working-directory: services/${{ matrix.workspace }}
        run: npm run check
      - name: Tests
        working-directory: services/${{ matrix.workspace }}
        run: npm test
      - name: Build
        working-directory: services/${{ matrix.workspace }}
        run: npm run build

  platform-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Django checks
        run: |
          python -m pip install -r apps/api/requirements.txt
          cd apps/api
          DJANGO_SECRET_KEY=ci-placeholder python manage.py check
